specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: NameNFT
    network: rise-testnet
    source:
      address: "0x35b78504bBAdBe7ab6d244725Ec685a7C7402398"
      abi: NameNFT
      startBlock: 44875247
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Domain
        - Account
        - TextRecord
      abis:
        - name: NameNFT
          file: ./abis/NameNFT.json
      eventHandlers:
        - event: NameRegistered(indexed uint256,string,indexed address,uint256)
          handler: handleNameRegistered
        - event: NameRenewed(indexed uint256,uint256)
          handler: handleNameRenewed
        - event: AddrChanged(indexed bytes32,address)
          handler: handleAddrChanged
        - event: TextChanged(indexed bytes32,string,string)
          handler: handleTextChanged
        - event: PrimaryNameSet(indexed address,indexed uint256)
          handler: handlePrimaryNameSet
      file: ./src/mappings.ts
